version: '3.8'

services:
  tim-router-api:
    build: .
    container_name: tim-router-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ROUTER_HOST=${ROUTER_HOST:-192.168.1.1}
      - ROUTER_USERNAME=${ROUTER_USER:-admin}
      - ROUTER_PASSWORD=${ROUTER_PASSWORD}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - AUTO_LOGIN_ON_STARTUP=true
    volumes:
      - ./assets:/app/assets:ro
